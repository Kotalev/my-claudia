<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mission Control — font variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400&family=Manrope:wght@400;500;600&family=Fira+Code:wght@400;500&family=Archivo:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ground: #08090a; --panel: #0a0b0c; --card: #0e1011; --hair: #16191a;
    --edge: #1c1e20; --line: #23282a;
    --bright: #f7f8f8; --body: #e8e9ea; --soft: #c9ced1; --muted: #9aa0a4;
    --faint: #8b9195; --dim: #7b8187;
    --work: #3ddc84; --work-edge: #1f8f57; --alarm: #f5a742; --info: #4d9dff;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--ground); color: var(--body); padding: 48px 32px 96px; -webkit-font-smoothing: antialiased; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes shimmer { from { background-position: -140% 0; } to { background-position: 240% 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .intro { max-width: 70ch; margin: 0 auto 40px; display: flex; flex-direction: column; gap: 8px; }
  .intro h1 { font: 600 24px/1.2 "IBM Plex Sans", sans-serif; letter-spacing: -0.01em; color: var(--bright); }
  .intro p { font: 400 14px/1.6 "IBM Plex Sans", sans-serif; color: var(--muted); }

  .variant { max-width: 1100px; margin: 0 auto 56px; }
  .variant-label {
    font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--work); margin-bottom: 6px;
  }
  .variant-sub { font: 400 12px/1.5 var(--mono); color: var(--faint); margin-bottom: 14px; }

  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; overflow: hidden; font-family: var(--sans); }

  .hdr { display: flex; align-items: center; gap: 14px; padding: 18px 24px; border-bottom: 1px solid var(--hair); }
  .hdr .title { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; color: var(--bright); }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 9px; border-radius: 5px;
    background: rgba(61,220,132,.08); border: 1px solid rgba(61,220,132,.24); }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--work); animation: breathe 2.6s ease-in-out infinite; }
  .chip span { font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--work); }
  .hdr .email { font: 400 12px/1 var(--mono); color: var(--faint); }
  .hdr .btn { margin-left: auto; font: 400 11.5px/1 var(--mono); color: var(--body);
    background: var(--hair); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }

  .gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--hair); border-bottom: 1px solid var(--hair); }
  .gauge { background: var(--panel); padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; }
  .gauge .cap { display: flex; justify-content: space-between; font: 400 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .gauge .cap em { font-style: normal; letter-spacing: 0; text-transform: none; font-size: 11px; color: var(--dim); }
  .gauge .figures { display: flex; gap: 30px; align-items: flex-end; }
  .fig { display: flex; flex-direction: column; gap: 4px; }
  .fig b { font: 400 21px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--body); }
  .fig.small b { font-size: 16px; color: var(--muted); }
  .fig span { font: 400 11px/1 var(--mono); color: var(--faint); }
  .meterwrap { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .meterrow { display: flex; align-items: baseline; gap: 8px; }
  .meterrow b { font: 400 21px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--body); }
  .meterrow span { font: 400 11px/1 var(--mono); color: var(--faint); }
  .meter { position: relative; height: 8px; border-radius: 4px; background: var(--hair); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 4px; background: var(--info); }
  .meter u { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }

  .live { padding: 18px 24px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--hair); }
  .live .band { display: flex; align-items: center; gap: 12px; }
  .live .band .lbl { font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--work); }
  .live .band .sum { font: 400 12px/1 var(--mono); color: var(--muted); }
  .live .band .rule { flex: 1; height: 1px; background: var(--hair); }
  .live .band .none { font: 400 11px/1 var(--mono); color: var(--dim); }
  .row { display: flex; gap: 14px; align-items: flex-start; padding: 15px 17px; border-radius: 9px;
    background: var(--card); border: 1px solid #1a201d; border-left: 3px solid var(--work-edge); }
  .orbit { position: relative; width: 14px; height: 14px; margin-top: 2px; flex: none; }
  .orbit i { position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid transparent;
    border-top-color: var(--work); border-right-color: rgba(61,220,132,.3); animation: orbit 1.4s linear infinite; }
  .orbit u { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
    border-radius: 50%; background: var(--work); box-shadow: 0 0 8px rgba(61,220,132,.55); }
  .row .main { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .row .top { display: flex; gap: 14px; align-items: baseline; }
  .row .who { display: flex; align-items: baseline; gap: 9px; flex: 1; min-width: 0; }
  .row .name { font: 400 13px/1.2 var(--mono); color: var(--work); }
  .row .sep { font: 400 12px/1 var(--mono); color: #3a3f42; }
  .row .prompt { font-size: 15px; font-weight: 500; color: var(--bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .age { font: 400 12px/1 var(--mono); color: var(--muted); flex: none; }
  .row .meta { display: flex; align-items: center; gap: 10px; font: 400 11.5px/1 var(--mono); color: var(--faint); }
  .row .meta .st { color: var(--work); letter-spacing: .1em; text-transform: uppercase; font-size: 10.5px; }
  .bar { width: 140px; height: 6px; border-radius: 3px; background: var(--hair); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 24%;
    background: linear-gradient(90deg, rgba(77,157,255,.6) 0%, rgba(255,255,255,.45) 50%, rgba(77,157,255,.6) 100%);
    background-size: 220% 100%; animation: shimmer 2.4s linear infinite; }
  .tag { border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }

  .srow { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border-radius: 7px; border-left: 3px solid transparent; }
  .srow .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--dim); margin-top: 5px; flex: none; }
  .srow .t { font-size: 13.5px; color: var(--muted); }
  .srow .m { font: 400 11px/1.5 var(--mono); color: var(--dim); }

  .script { display: flex; flex-direction: column; gap: 6px; padding: 18px 24px; }
  .turn { display: flex; gap: 14px; padding: 12px 14px; border-radius: 9px; }
  .turn.user { background: var(--card); border-left: 3px solid var(--info); }
  .turn .role { font: 400 10.5px/1.6 var(--mono); letter-spacing: .1em; text-transform: uppercase; width: 60px; flex: none; }
  .turn.user .role { color: var(--info); }
  .turn.claude .role { color: var(--work); }
  .turn .txt { flex: 1; font-size: 15px; line-height: 1.6; }
  .turn.user .txt { color: var(--bright); }
  .turn.claude .txt { color: var(--body); }
  .turn .time { font: 400 11px/2.2 var(--mono); color: var(--dim); }
  .act { display: flex; gap: 14px; align-items: center; padding: 2px 14px; }
  .act .role { font: 400 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); width: 60px; flex: none; }
  .act .box { flex: 1; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 7px;
    background: var(--card); border: 1px solid var(--edge); }
  .act .box b { font: 400 11.5px/1 var(--mono); font-weight: 400; color: var(--muted); }
  .act .box span { font: 400 11px/1 var(--mono); color: var(--dim); }
  .act .box em { margin-left: auto; font: 400 11px/1 var(--mono); font-style: normal; color: var(--faint); }
</style>
</head>
<body>

<div class="intro">
  <h1>Font variants — same tokens, different type</h1>
  <p>Шест варианта на една и съща секция. Първият е текущият (IBM Plex) за сравнение. Всеки вариант е двойка: основен шрифт за заглавия/текст + моноширинен за инструменталния слой (цифри, статуси, метаданни).</p>
</div>

<script>
  const VARIANTS = [
    { n: 1, sans: "'IBM Plex Sans', sans-serif", mono: "'IBM Plex Mono', monospace",
      label: "1 · IBM Plex Sans + IBM Plex Mono", sub: "текущият — неутрален, инженерен, малко по-широк моно" },
    { n: 2, sans: "'Inter', sans-serif", mono: "'JetBrains Mono', monospace",
      label: "2 · Inter + JetBrains Mono", sub: "UI класика — плътен, много четим на дребно; монотото е по-живо" },
    { n: 3, sans: "'Geist', sans-serif", mono: "'Geist Mono', monospace",
      label: "3 · Geist + Geist Mono", sub: "модерен, стегнат, леко технически; монотото е тясно и тихо" },
    { n: 4, sans: "'Space Grotesk', sans-serif", mono: "'Space Mono', monospace",
      label: "4 · Space Grotesk + Space Mono", sub: "най-характерен — ретро-терминален привкус, повече личност" },
    { n: 5, sans: "'Manrope', sans-serif", mono: "'Fira Code', monospace",
      label: "5 · Manrope + Fira Code", sub: "мек и заоблен санс срещу познато код-моно" },
    { n: 6, sans: "'Archivo', sans-serif", mono: "'Martian Mono', monospace",
      label: "6 · Archivo + Martian Mono", sub: "плътни гротескови форми; монотото е широко и много механично" },
  ]

  const SAMPLE = (v) => `
  <section class="variant" style="--sans:${v.sans};--mono:${v.mono}">
    <div class="variant-label">${v.label}</div>
    <div class="variant-sub">${v.sub}</div>
    <div class="panel">
      <div class="hdr">
        <span class="title">Mission Control</span>
        <span class="chip"><i class="dot"></i><span>live</span></span>
        <span class="email">ivan.hristev@pcloud.com</span>
        <button class="btn">+ add project</button>
      </div>
      <div class="gauges">
        <div class="gauge">
          <div class="cap"><span>plan</span><em>measured just now</em></div>
          <div class="figures" style="gap:34px;">
            <div class="meterwrap">
              <div class="meterrow"><b>52%</b><span>5h window</span></div>
              <div class="meter"><i style="width:52%"></i><u style="left:75%"></u><u style="left:90%"></u></div>
            </div>
            <div class="meterwrap">
              <div class="meterrow"><b>30%</b><span>7d window</span></div>
              <div class="meter"><i style="width:30%"></i><u style="left:75%"></u><u style="left:90%"></u></div>
            </div>
          </div>
        </div>
        <div class="gauge">
          <div class="cap"><span>spend</span><em>list-price estimate ⓘ</em></div>
          <div class="figures">
            <div class="fig"><b>$340</b><span>today</span></div>
            <div class="fig small"><b>$3411</b><span>7d</span></div>
            <div class="fig small"><b>$8586</b><span>30d</span></div>
          </div>
        </div>
      </div>
      <div class="live">
        <div class="band">
          <span class="lbl">live</span>
          <span class="sum">2 processes in 1 project</span>
          <span class="rule"></span>
          <span class="none">nothing waiting</span>
        </div>
        <div class="row">
          <div class="orbit"><i></i><u></u></div>
          <div class="main">
            <div class="top">
              <div class="who">
                <span class="name">my-claudia-45</span>
                <span class="sep">·</span>
                <span class="prompt">добре е, използвай dynamic workflows</span>
              </div>
              <span class="age">34m</span>
            </div>
            <div class="meta">
              <span class="st">working</span>
              <span class="bar"><i></i></span>
              <span>117k / 1.0M</span>
              <span class="tag">fable-5</span>
              <span class="tag">medium</span>
            </div>
          </div>
        </div>
        <div class="srow">
          <span class="dot"></span>
          <div>
            <div class="t">Махни тази част: [Image #1]. Не ни е нужна</div>
            <div class="m">done · 1m ago · 151 msgs · subagents</div>
          </div>
        </div>
      </div>
      <div class="script">
        <div class="turn user">
          <span class="role">user</span>
          <div>
            <div class="txt">добре виж сега само на всички екрани контраста на текста</div>
            <div class="time">4:53:18 PM</div>
          </div>
        </div>
        <div class="act">
          <span class="role">activity</span>
          <div class="box"><b>Edit ×3 · Bash ×2 · Read ×1</b><span>TASKS.md, ledger.ts, +2</span><em>expand ▾</em></div>
        </div>
        <div class="turn claude">
          <span class="role">claude</span>
          <div>
            <div class="txt">Готово и потвърдено в браузъра: лентата вече показва SPEND today $338 · 7d $3409 · 30d $8585 под PLAN, а цифрите се обновяват през ново spend.updated събитие.</div>
            <div class="time">4:53:56 PM</div>
          </div>
        </div>
      </div>
    </div>
  </section>`

  document.body.insertAdjacentHTML('beforeend', VARIANTS.map(SAMPLE).join(''))
</script>
</body>
</html>
